name: release
on:
  push:
    branches: [main]
    paths: ["faultypacket_audit/**", "pyproject.toml"]
permissions: {contents: write}
concurrency: {group: release}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Tag only when the package version changes
        id: v
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' faultypacket_audit/__init__.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$V" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Create release with rules.json attached
        if: steps.v.outputs.new == 'true'
        env: {GH_TOKEN: "${{ github.token }}", V: "${{ steps.v.outputs.version }}"}
        run: |
          notes=$(awk -v v="## $V" '$0 ~ "^"v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "v$V" faultypacket_audit/data/rules.json --title "v$V" --notes "${notes:-Release v$V}"
      - name: Move the major tag (v1) to this release
        if: steps.v.outputs.new == 'true'
        env: {V: "${{ steps.v.outputs.version }}"}
        run: |
          git fetch --tags --force
          git tag -f "v${V%%.*}" "v$V"
          git push -f origin "v${V%%.*}"
